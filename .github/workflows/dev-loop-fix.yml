name: Dev Loop Fix

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to fix findings on (manual backstop / retry / reviewer chain)
        required: true
        type: string
      review_id:
        description: Review id whose findings to fix; empty = latest marker review
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: dev-loop-pr-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  fix:
    name: Fixer (review findings and/or conflict -> fix commits / merge commit)
    # Fixer runs on the same PR serialize in the shared dev-loop-pr-<N> group;
    # double-dispatch is bounded by the head-SHA dedupes plus the stale-head
    # re-dispatch in the reviewer (docs/dev-loop.md).
    runs-on: ubuntu-latest
    # 15 min above --time-limit (3600 s = 60 min), per docs/dev-loop.md budgets table
    timeout-minutes: 75
    env:
      GH_REPO: ${{ github.repository }}
      MAX_TURNS: '400'
      MAX_TOKENS: '4000000'
      TIME_LIMIT_SEC: '3600'
      TIME_LIMIT_MIN: '60'
      OPENCODE_VERSION: '2.0.26'
      MAX_DENIED_STREAK: '6'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DEV_LOOP_TOKEN }}

      - name: Gate and dedupe
        id: gate
        env:
          GH_TOKEN: ${{ secrets.DEV_LOOP_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          UNLABELED_NAME: ${{ github.event.label.name }}
          EVENT_REVIEW_ID: ${{ github.event.review.id }}
          REVIEW_BODY: ${{ github.event.review.body }}
          HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
          REPO_ID: ${{ github.event.repository.id }}
          REVIEW_ID_INPUT: ${{ inputs.review_id }}
          WR_EVENT_NAME: ${{ github.event.workflow_run.name }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR number in event; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$EVENT_ACTION" = "unlabeled" ] \
            && [ "$UNLABELED_NAME" != "needs-human" ]; then
            echo "Unlabeled '$UNLABELED_NAME', not needs-human; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fork PRs: never touch them (pull_request_review events carry the PR too).
          # Compare repository IDs: head.repo.id and repository.id share the
          # repository ID space; the owner is a user/org ID and never matches.
          if [ -n "$HEAD_REPO_ID" ] && [ "$HEAD_REPO_ID" != "$REPO_ID" ]; then
            echo "PR #$PR_NUMBER is from a fork; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh label create needs-human --color B60205 \
            --description "dev-loop: human decision required" 2>/dev/null || true
          gh label create dev-loop --color 46A1AA \
            --description "Development and reviewing is performed by an agentic AI dev-loop" 2>/dev/null || true
          # workflow_run (ci.yml completed) conflict path: the payload has no PR
          # object - resolve the PR from head_branch/head_sha, apply the repo-ID
          # fork gate (PR #93), and only proceed on mergeable == CONFLICTING.
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$WR_EVENT_NAME" != "CI" ]; then
              echo "workflow_run is for '$WR_EVENT_NAME', not CI; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            wr_pr="$(gh pr list --head "$WR_HEAD_BRANCH" --state open --json number,headRefOid \
              | jq -r --arg sha "$WR_HEAD_SHA" '[.[] | select(.headRefOid == $sha)] | first | .number // empty')"
            if [ -z "$wr_pr" ]; then
              echo "No open PR with head branch '$WR_HEAD_BRANCH' at head SHA $WR_HEAD_SHA; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            PR_NUMBER="$wr_pr"
            wr_repo_id="$(gh pr view "$PR_NUMBER" --json headRepositoryId --jq .headRepositoryId)"
            if [ "$wr_repo_id" != "$REPO_ID" ]; then
              echo "PR #$PR_NUMBER is from a fork (head repo $wr_repo_id != $REPO_ID); skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            pr_json="$(gh pr view "$PR_NUMBER" --json labels,isDraft,mergeable,headRefOid)"
            if ! printf '%s' "$pr_json" | jq -e 'any(.labels[]; .name == "dev-loop")' >/dev/null; then
              echo "PR #$PR_NUMBER lacks the dev-loop label; the loop is opt-in. Skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if printf '%s' "$pr_json" | jq -e 'any(.labels[]; .name == "needs-human")' >/dev/null; then
              echo "PR #$PR_NUMBER is labeled needs-human; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$(printf '%s' "$pr_json" | jq -r '.isDraft')" = "true" ]; then
              echo "PR #$PR_NUMBER is draft; the loop never touches drafts. Skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            mergeable=""
            for _ in 1 2 3 4 5; do
              mergeable="$(gh pr view "$PR_NUMBER" --json mergeable --jq .mergeable)"
              [ "$mergeable" != "UNKNOWN" ] && break
              sleep 10
            done
            if [ "$mergeable" != "CONFLICTING" ]; then
              echo "PR #$PR_NUMBER mergeable is '$mergeable', not CONFLICTING; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            head_sha_before="$(printf '%s' "$pr_json" | jq -r '.headRefOid')"
            # Conflict-dispatch dedupe: one fixer run per head SHA - a
            # long-conflicted PR is not re-run on every CI tick. The branch's
            # ref still points at the CI head SHA iff no fixer pushed a merge
            # commit resolving the conflict from this head.
            remote_sha="$(git ls-remote origin "refs/heads/$WR_HEAD_BRANCH" | cut -f1)"
            if [ "$remote_sha" != "$WR_HEAD_SHA" ]; then
              echo "Head already moved past the CI head SHA ($WR_HEAD_SHA -> $remote_sha); a conflict fix already ran. Skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            branch="$WR_HEAD_BRANCH"
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "review_id=" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            echo "head_sha_before=$head_sha_before" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Event-payload gate: only a marker review with verdict CHANGES_NEEDED
          # starts the fixer. CLEAN and human reviews start nothing. The
          # unlabeled resume path re-fixes the latest CHANGES_NEEDED review.
          # KEEP IN SYNC with dev-loop-review.yml: these greps match the exact
          # marker-review body its post-step composes - the marker alone on
          # line 1 and a bare `Verdict: <V>` line.
          if [ "$EVENT_NAME" = "pull_request_review" ]; then
            if ! printf '%s' "$REVIEW_BODY" | head -1 | grep -q '^<!-- dev-loop-review -->$'; then
              echo "Review is not a dev-loop marker review; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! printf '%s' "$REVIEW_BODY" | grep -q '^Verdict: CHANGES_NEEDED$'; then
              echo "Marker review verdict is not CHANGES_NEEDED; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if ! gh pr view "$PR_NUMBER" --json labels \
            | jq -e 'any(.labels[]; .name == "dev-loop")' >/dev/null; then
            echo "PR #$PR_NUMBER lacks the dev-loop label; the loop is opt-in. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh pr view "$PR_NUMBER" --json labels \
            | jq -e 'any(.labels[]; .name == "needs-human")' >/dev/null; then
            echo "PR #$PR_NUMBER is labeled needs-human; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Resolve the review to act on: the event's own review id (exact, no
          # race), the explicit input, or the latest CHANGES_NEEDED marker
          # review on the PR (resume path).
          if [ -n "$EVENT_REVIEW_ID" ]; then
            review_id="$EVENT_REVIEW_ID"
          elif [ -n "$REVIEW_ID_INPUT" ]; then
            review_id="$REVIEW_ID_INPUT"
          else
            review_id="$(gh api repos/${GH_REPO}/pulls/$PR_NUMBER/reviews --paginate \
              | jq -r '[.[] | select(.body | startswith("<!-- dev-loop-review -->")) | select(.body | contains("Verdict: CHANGES_NEEDED"))] | last | .id // empty')"
          fi
          if [ -z "$review_id" ]; then
            # Manual dispatch with an empty review id: conflict-only run (the
            # workflow_run path also resolves to an empty review id). Proceed
            # without findings; the fixer prompt handles a missing review.
            echo "No CHANGES_NEEDED marker review on PR #$PR_NUMBER; treating this as a conflict-only run."
          fi
          if [ -n "$review_id" ]; then
            review_body="$(gh api repos/${GH_REPO}/pulls/$PR_NUMBER/reviews/$review_id --jq .body)"
            if ! printf '%s' "$review_body" | grep -q '^Verdict: CHANGES_NEEDED$'; then
              echo "Review $review_id is not a CHANGES_NEEDED review; nothing to fix. Skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # One fixer per review, implicitly: the reviewer chains the fixer only
          # while the head SHA still equals the reviewed commit_id, so if the head
          # has already moved past the reviewed SHA, a fix (or a human push) has
          # landed since - this review is already being acted on. Skip. On the
          # unlabeled resume path the human decides a re-fix is needed, so the
          # check does not apply. Exception: if every commit between the reviewed
          # SHA and the current head is a CI auto-format commit (message
          # "chore: auto-format", pushed by ci.yml straight to the PR branch),
          # no fix ran - the findings still stand and the fixer proceeds against
          # the formatted head.
          head_sha_before="$(gh pr view "$PR_NUMBER" --json headRefOid | jq -r '.headRefOid')"
          reviewed_sha=""
          if [ -n "$review_id" ]; then
            reviewed_sha="$(gh api repos/${GH_REPO}/pulls/$PR_NUMBER/reviews/$review_id --jq .commit_id)"
          fi
          if [ -n "$reviewed_sha" ] && [ "$EVENT_NAME" != "pull_request" ] && [ "$head_sha_before" != "$reviewed_sha" ]; then
            git fetch origin "$reviewed_sha" "$head_sha_before" --quiet
            # Fail closed: if the range cannot be resolved (shallow checkout,
            # pruned history), the intervening commits are unknown - skip
            # instead of proceeding on an unverified delta.
            if ! git log --format='%s' "$reviewed_sha..$head_sha_before" >/dev/null 2>&1; then
              echo "Cannot resolve the range $reviewed_sha..$head_sha_before; cannot verify whether only auto-format commits moved the head. Skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            non_format="$(git log --format='%s' "$reviewed_sha..$head_sha_before" | grep -vc '^chore: auto-format$' || true)"
            if [ "${non_format:-1}" = "0" ]; then
              echo "Head moved only by CI auto-format commits ($reviewed_sha -> $head_sha_before); no fix ran yet, proceeding with the findings."
            else
              echo "Head SHA ($head_sha_before) already moved past the reviewed SHA ($reviewed_sha) by a non-auto-format commit; a fix for review $review_id already ran. Skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          branch="$(gh pr view "$PR_NUMBER" --json headRefName | jq -r '.headRefName')"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "review_id=$review_id" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head_sha_before=$head_sha_before" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      - name: Render role prompt with budget
        if: steps.gate.outputs.skip != 'true'
        run: |
          mkdir -p out
          sed -e "s/\${MAX_TURNS}/${MAX_TURNS}/g" \
              -e "s/\${TIME_LIMIT_MIN}/${TIME_LIMIT_MIN}/g" \
              .github/dev-loop/prompts/fixer.md > out/fixer.rendered.md
          echo "--- rendered prompt ---"
          cat out/fixer.rendered.md

      - name: Install opencode
        if: steps.gate.outputs.skip != 'true'
        run: |
          # The v2 installer (npm package @opencode/cli) installs to
          # ~/.opencode/bin; the v1 installer at https://opencode.ai/install
          # ships 1.x and cannot reach 2.x releases.
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --version "$OPENCODE_VERSION"
          export PATH="$HOME/.opencode/bin:$PATH"
          command -v opencode
          # The invocation below is verified against this exact version; the
          # v1 -> v2 CLI surface moved substantially (auth/provider/config
          # flags, managed-service architecture, event schema).
          opencode --version | grep -F "$OPENCODE_VERSION" || {
            echo "::error::Installed opencode version does not match the expected $OPENCODE_VERSION - verify the invocation against the new CLI surface before rerunning"
            exit 1
          }

      - name: Run opencode fixer
        id: opencode
        if: steps.gate.outputs.skip != 'true'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GH_TOKEN: ${{ secrets.DEV_LOOP_TOKEN }}
          DEV_LOOP_PR: ${{ steps.gate.outputs.pr_number }}
          DEV_LOOP_BRANCH: ${{ steps.gate.outputs.branch }}
          DEV_LOOP_REVIEW_ID: ${{ steps.gate.outputs.review_id }}
          # Job-local config dir: MISTRAL_API_KEY must be the only credential
          # source (stored auth would otherwise silently mask a rotated secret).
          OPENCODE_CONFIG_DIR: ${{ runner.temp }}/opencode-config
          OPENCODE_DISABLE_AUTOUPDATE: 'true'
          # The managed service binds a loopback port; never route it via a
          # proxy. Env keys are case-insensitive, so this covers both the
          # NO_PROXY and no_proxy spellings that tools check.
          NO_PROXY: 127.0.0.1,localhost
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          mkdir -p "$OPENCODE_CONFIG_DIR"

          # Watchdog: consume the JSON event stream, tee it to a file, and kill
          # opencode when the run degenerates:
          #  - MAX_DENIED_STREAK consecutive failed/denied tool calls (state
          #    "failed", or "completed" with a non-zero shell exit)
          #  - MAX_TURNS steps (step_start events)
          #  - MAX_TOKENS cumulative cost-weighted tokens: input + output +
          #    cache.write + 0.1 * cache.read (cached tokens are billed at 10%,
          #    so the cap means "N uncached-equivalent tokens")
          run_watchdog() {
            streak=0
            steps=0
            tokens=0
            jq -c '
              select(.type == "tool_use" or .type == "step_start" or .type == "step_finish")
              | if .type == "tool_use" then {
                    k: "tool",
                    status: (.part.state.status // ""),
                    exit: (.part.state.metadata.metadata.exit // 0)
                  }
                elif .type == "step_start" then { k: "step" }
                else {
                    k: "tokens",
                    t: (
                      (.part.tokens.input // 0)
                      + (.part.tokens.output // 0)
                      + (.part.tokens.cache.write // 0)
                      + (0.1 * (.part.tokens.cache.read // 0))
                    )
                  }
                end' 2>/dev/null \
            | while IFS= read -r entry; do
                k="$(printf '%s' "$entry" | jq -r '.k')"
                case "$k" in
                  step)
                    steps=$((steps + 1))
                    if [ "$steps" -ge "$MAX_TURNS" ]; then
                      echo "watchdog: step limit $MAX_TURNS reached - killing opencode"
                      pkill -TERM -f 'opencode run' || true
                      exit 99
                    fi
                    ;;
                  tokens)
                    tt="$(printf '%s' "$entry" | jq -r '.t')"
                    tokens=$(jq -n --argjson a "$tokens" --argjson b "$tt" '$a + $b | floor')
                    if [ "$tokens" -ge "$MAX_TOKENS" ]; then
                      echo "watchdog: token limit $MAX_TOKENS reached - killing opencode"
                      pkill -TERM -f 'opencode run' || true
                      exit 99
                    fi
                    ;;
                  tool)
                    status="$(printf '%s' "$entry" | jq -r '.status')"
                    exit_code="$(printf '%s' "$entry" | jq -r '.exit')"
                    if [ "$status" = "failed" ] || { [ "$status" = "completed" ] && [ "$exit_code" != "0" ] && [ -n "$exit_code" ] && [ "$exit_code" != "null" ]; }; then
                      streak=$((streak + 1))
                      echo "watchdog: failed tool call streak = $streak"
                      if [ "$streak" -ge "$MAX_DENIED_STREAK" ]; then
                        echo "watchdog: $streak consecutive failed tool calls - killing opencode"
                        pkill -TERM -f 'opencode run' || true
                        exit 99
                      fi
                    elif [ "$status" = "completed" ]; then
                      streak=0
                    fi
                    ;;
                esac
              done
          }

          set -o pipefail
          set +e
          timeout --signal=TERM --kill-after=60 "$TIME_LIMIT_SEC" \
            opencode run --standalone --format json --auto --model mistral/zai-glm-5-3 \
              "$(cat out/fixer.rendered.md)" \
            2> out/opencode.stderr \
            | tee out/stream.ndjson \
            | run_watchdog
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "--- opencode stderr ---"
          cat out/opencode.stderr || true
          if [ "$rc" = "99" ]; then
            echo "stopped_by_watchdog=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload opencode output artifact
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: opencode-fixer-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/stream.ndjson
            out/opencode.stderr
            out/fixer.rendered.md
          if-no-files-found: warn

      - name: Post-step state machine
        if: always() && steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.DEV_LOOP_TOKEN }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          REVIEW_ID: ${{ steps.gate.outputs.review_id }}
          BRANCH: ${{ steps.gate.outputs.branch }}
          HEAD_SHA_BEFORE: ${{ steps.gate.outputs.head_sha_before }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          escalate() {
            gh pr edit "$PR_NUMBER" --add-label needs-human >/dev/null
            cat > /tmp/dev-loop-escalation.md <<EOF
          <!-- dev-loop-escalation -->
          @chrthom dev-loop fixer escalation: $1

          PR: #${PR_NUMBER}
          Review: ${REVIEW_ID}
          Run: ${RUN_URL}
          EOF
            gh pr comment "$PR_NUMBER" --body-file /tmp/dev-loop-escalation.md >/dev/null
          }

          rc="${{ steps.opencode.outputs.rc }}"

          if [ -z "$rc" ]; then
            # opencode never ran: a pre-run step (npm ci, install, version check, render) failed.
            if [ "$RUN_ATTEMPT" = "1" ]; then
              echo "A step failed before the agent ran; leaving a red run for re-run failed jobs."
              exit 1
            fi
            escalate "a workflow step failed before the agent ran (twice); retry via workflow_dispatch (Actions -> Dev Loop Fix -> Run workflow) or remove the needs-human label"
            exit 0
          fi

          # Cost = sum of the per-step cost fields in the event stream
          # (opencode reports cost/tokens on every step_finish event).
          cost="$(jq -s '[.[].part.cost // 0] | add // 0' out/stream.ndjson 2>/dev/null || echo 0)"
          stderr_tail="$(tail -1 out/opencode.stderr 2>/dev/null || true)"

          if [ "$rc" = "99" ]; then
            # The watchdog killed opencode (failure streak / step / token cap):
            # the run misbehaved or blew the budget. Never retry, escalate.
            escalate "fixer killed by the watchdog (rc=99; failure streak / step cap ${MAX_TURNS} / token cap ${MAX_TOKENS}; cost: \$$cost) - see the opencode output artifact"
            exit 0
          fi

          if [ "$rc" = "124" ]; then
            # deadline hit (timeout(1)): never auto-retry, escalate.
            escalate "fixer stopped on the ${TIME_LIMIT_MIN} min deadline (rc=124, cost: \$$cost); see the opencode output artifact"
            exit 0
          fi

          if [ "$rc" = "1" ]; then
            # opencode exits 1 for both config errors (deterministic - a retry
            # fails identically) and infrastructure failures (API unreachable);
            # not reliably separable by rc, so never auto-retry.
            escalate "opencode failed (exit 1, cost: \$$cost, $stderr_tail); retry via workflow_dispatch if the stderr indicates a transient failure; see the opencode output artifact"
            exit 0
          fi

          if [ "$rc" != "0" ]; then
            escalate "unexpected opencode exit code $rc (cost: \$$cost, $stderr_tail); see the opencode output artifact"
            exit 0
          fi

          # exit 0: parse the outcome contract from the final assistant text.
          final_msg="$(jq -r 'select(.type == "text") | .part.text' out/stream.ndjson 2>/dev/null || true)"
          outcome_line="$(printf '%s\n' "$final_msg" | awk 'NF { line = $0 } END { if (line) print line }')"

          case "$outcome_line" in
            WALL:*)
              escalate "fixer stopped early with ${outcome_line} (cost: \$$cost)"
              exit 0
              ;;
            FIXED:*)
              echo "Fixer finished: $outcome_line (cost: \$$cost)"
              head_sha_now="$(gh pr view "$PR_NUMBER" --json headRefOid | jq -r '.headRefOid')"
              if [ "$head_sha_now" = "$HEAD_SHA_BEFORE" ]; then
                escalate "fixer reported FIXED but the head SHA is unchanged ($head_sha_now) - the fixer made no change; see the opencode output artifact"
                exit 0
              fi
              # No reviewer chain: the push itself fires synchronize, which
              # re-triggers the reviewer (docs/dev-loop.md event map).
              echo "Push landed ($HEAD_SHA_BEFORE -> $head_sha_now); synchronize will re-review the new head."
              exit 0
              ;;
            *)
              escalate "unparseable outcome (exit 0, final message does not match the contract); transcript artifact preserved for diagnosis"
              exit 0
              ;;
          esac
