name: Dev Loop Implement

on:
  issues:
    types: [opened, reopened, unlabeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to implement (manual backstop / retry)
        required: true
        type: string
      retry:
        description: Internal retry counter (do not edit)
        required: false
        default: '0'
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: dev-loop-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  implement:
    name: Implementer (issue -> draft PR)
    runs-on: ubuntu-latest
    # 15 min above --time-limit (5400 s = 90 min), per docs/dev-loop.md budgets table
    timeout-minutes: 105
    env:
      GH_REPO: ${{ github.repository }}
      MAX_TURNS: '800'
      MAX_TOKENS: '6000000'
      TIME_LIMIT_SEC: '5400'
      TIME_LIMIT_MIN: '90'
      OPENCODE_VERSION: '2.0.26'
      MAX_DENIED_STREAK: '6'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DEV_LOOP_TOKEN }}

      - name: Gate and dedupe
        id: gate
        env:
          GH_TOKEN: ${{ secrets.DEV_LOOP_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          EVENT_ACTION: ${{ github.event.action }}
          UNLABELED_NAME: ${{ github.event.label.name }}
        run: |
          set -eu
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "No issue number in event; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_ACTION" = "unlabeled" ] && [ "$UNLABELED_NAME" != "needs-human" ]; then
            echo "Unlabeled '$UNLABELED_NAME', not needs-human; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh label create needs-human --color B60205 \
            --description "dev-loop: human decision required" 2>/dev/null || true
          if gh issue view "$ISSUE_NUMBER" --json labels \
            | jq -e 'any(.labels[]; .name == "needs-human")' >/dev/null; then
            echo "Issue #$ISSUE_NUMBER is labeled needs-human; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git ls-remote origin "refs/heads/vibe/issue-$ISSUE_NUMBER-*")" ]; then
            echo "Branch vibe/issue-$ISSUE_NUMBER-* already exists; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      - name: Render role prompt with budget
        if: steps.gate.outputs.skip != 'true'
        run: |
          mkdir -p out
          sed -e "s/\${MAX_TURNS}/${MAX_TURNS}/g" \
              -e "s/\${TIME_LIMIT_MIN}/${TIME_LIMIT_MIN}/g" \
              .github/dev-loop/prompts/implementer.md > out/implementer.rendered.md
          echo "--- rendered prompt ---"
          cat out/implementer.rendered.md

      - name: Install opencode
        if: steps.gate.outputs.skip != 'true'
        run: |
          # The v2 installer (npm package @opencode/cli) installs to
          # ~/.opencode/bin; the v1 installer at https://opencode.ai/install
          # ships 1.x and cannot reach 2.x releases.
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --version "$OPENCODE_VERSION"
          export PATH="$HOME/.opencode/bin:$PATH"
          command -v opencode
          # The invocation below is verified against this exact version; the
          # v1 -> v2 CLI surface moved substantially (auth/provider/config
          # flags, managed-service architecture, event schema).
          opencode --version | grep -F "$OPENCODE_VERSION" || {
            echo "::error::Installed opencode version does not match the expected $OPENCODE_VERSION - verify the invocation against the new CLI surface before rerunning"
            exit 1
          }

      - name: Run opencode implementer
        id: opencode
        if: steps.gate.outputs.skip != 'true'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GH_TOKEN: ${{ secrets.DEV_LOOP_TOKEN }}
          DEV_LOOP_ISSUE: ${{ steps.gate.outputs.issue_number }}
          # Job-local config dir: MISTRAL_API_KEY must be the only credential
          # source (stored auth would otherwise silently mask a rotated secret).
          OPENCODE_CONFIG_DIR: ${{ runner.temp }}/opencode-config
          OPENCODE_DISABLE_AUTOUPDATE: 'true'
          # The managed service binds a loopback port; never route it via a
          # proxy. Env keys are case-insensitive, so this covers both the
          # NO_PROXY and no_proxy spellings that tools check.
          NO_PROXY: 127.0.0.1,localhost
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          mkdir -p "$OPENCODE_CONFIG_DIR"

          # Watchdog: consume the JSON event stream, tee it to a file, and kill
          # opencode when the run degenerates:
          #  - MAX_DENIED_STREAK consecutive failed/denied tool calls (state
          #    "failed", or "completed" with a non-zero shell exit) - the agent
          #    is burning the budget for nothing (a denial loop did exactly
          #    that on the first live vibe run)
          #  - MAX_TURNS steps (step_start events; ~7x the vibe budget, cheap
          #    thanks to prompt caching)
          #  - MAX_TOKENS cumulative cost-weighted tokens: input + output +
          #    cache.write + 0.1 * cache.read (cached tokens are billed at 10%,
          #    so the cap means "N uncached-equivalent tokens" and a cheap,
          #    healthy cached run cannot blow it - same cost semantics as the
          #    vibe-era --max-tokens)
          run_watchdog() {
            streak=0
            steps=0
            tokens=0
            jq -c '
              select(.type == "tool_use" or .type == "step_start" or .type == "step_finish")
              | if .type == "tool_use" then {
                    k: "tool",
                    status: (.part.state.status // ""),
                    exit: (.part.state.metadata.metadata.exit // 0)
                  }
                elif .type == "step_start" then { k: "step" }
                else {
                    k: "tokens",
                    t: (
                      (.part.tokens.input // 0)
                      + (.part.tokens.output // 0)
                      + (.part.tokens.cache.write // 0)
                      + (0.1 * (.part.tokens.cache.read // 0))
                    )
                  }
                end' 2>/dev/null \
            | while IFS= read -r entry; do
                k="$(printf '%s' "$entry" | jq -r '.k')"
                case "$k" in
                  step)
                    steps=$((steps + 1))
                    if [ "$steps" -ge "$MAX_TURNS" ]; then
                      echo "watchdog: step limit $MAX_TURNS reached - killing opencode"
                      pkill -TERM -f 'opencode run' || true
                      exit 99
                    fi
                    ;;
                  tokens)
                    tt="$(printf '%s' "$entry" | jq -r '.t')"
                    tokens=$(jq -n --argjson a "$tokens" --argjson b "$tt" '$a + $b | floor')
                    if [ "$tokens" -ge "$MAX_TOKENS" ]; then
                      echo "watchdog: token limit $MAX_TOKENS reached - killing opencode"
                      pkill -TERM -f 'opencode run' || true
                      exit 99
                    fi
                    ;;
                  tool)
                    status="$(printf '%s' "$entry" | jq -r '.status')"
                    exit_code="$(printf '%s' "$entry" | jq -r '.exit')"
                    if [ "$status" = "failed" ] || { [ "$status" = "completed" ] && [ "$exit_code" != "0" ] && [ -n "$exit_code" ] && [ "$exit_code" != "null" ]; }; then
                      streak=$((streak + 1))
                      echo "watchdog: failed tool call streak = $streak"
                      if [ "$streak" -ge "$MAX_DENIED_STREAK" ]; then
                        echo "watchdog: $streak consecutive failed tool calls - killing opencode"
                        pkill -TERM -f 'opencode run' || true
                        exit 99
                      fi
                    elif [ "$status" = "completed" ]; then
                      streak=0
                    fi
                    ;;
                esac
              done
          }

          set -o pipefail
          set +e
          timeout --signal=TERM --kill-after=60 "$TIME_LIMIT_SEC" \
            opencode run --standalone --format json --auto --model mistral/zai-glm-5-3 \
              "$(cat out/implementer.rendered.md)" \
            2> out/opencode.stderr \
            | tee out/stream.ndjson \
            | run_watchdog
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "--- opencode stderr ---"
          cat out/opencode.stderr || true
          if [ "$rc" = "99" ]; then
            echo "stopped_by_watchdog=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload opencode output artifact
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: opencode-implementer-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/stream.ndjson
            out/opencode.stderr
            out/implementer.rendered.md
          if-no-files-found: warn

      - name: Post-step state machine
        if: always() && steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.DEV_LOOP_TOKEN }}
          ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
          RETRY_COUNT: ${{ inputs.retry || '0' }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          escalate() {
            gh issue edit "$ISSUE_NUMBER" --add-label needs-human >/dev/null
            cat > /tmp/dev-loop-escalation.md <<EOF
          <!-- dev-loop-escalation -->
          @chrthom dev-loop implementer escalation: $1

          Issue: #${ISSUE_NUMBER}
          Run: ${RUN_URL}
          EOF
            gh issue comment "$ISSUE_NUMBER" --body-file /tmp/dev-loop-escalation.md >/dev/null
          }

          rc="${{ steps.opencode.outputs.rc }}"

          if [ -z "$rc" ]; then
            # opencode never ran: a pre-run step (npm ci, install, version check, render) failed.
            if [ "$RUN_ATTEMPT" = "1" ]; then
              echo "A step failed before the agent ran; leaving a red run for re-run failed jobs."
              exit 1
            fi
            escalate "a workflow step failed before the agent ran (twice); retry via workflow_dispatch (Actions -> Dev Loop Implement -> Run workflow) or remove the needs-human label"
            exit 0
          fi

          # Cost = sum of the per-step cost fields in the event stream
          # (opencode reports cost/tokens on every step_finish event). tokens
          # uses the same cost-weighted sum as the watchdog cap, so the
          # reported number matches what the cap enforced.
          cost="$(jq -s '[.[].part.cost // 0] | add // 0' out/stream.ndjson 2>/dev/null || echo 0)"
          tokens="$(jq -s '[.[].part.tokens // empty
            | (.input // 0) + (.output // 0) + (.cache.write // 0) + (0.1 * (.cache.read // 0))] | add // 0' out/stream.ndjson 2>/dev/null || echo 0)"
          stderr_tail="$(tail -1 out/opencode.stderr 2>/dev/null || true)"

          if [ "$rc" = "99" ]; then
            # The watchdog killed opencode (failure streak / step / token cap):
            # the run misbehaved or blew the budget. Never retry, escalate.
            escalate "implementer killed by the watchdog (rc=99; failure streak / step cap ${MAX_TURNS} / token cap ${MAX_TOKENS}; cost: \$$cost) - see the opencode output artifact"
            exit 0
          fi

          if [ "$rc" = "124" ]; then
            # deadline hit (timeout(1)): never auto-retry, escalate.
            escalate "implementer stopped on the ${TIME_LIMIT_MIN} min deadline (rc=124, cost: \$$cost); see the opencode output artifact"
            exit 0
          fi

          if [ "$rc" = "0" ]; then
            # Final assistant text = last non-empty line across all text events.
            outcome_line="$(jq -r 'select(.type == "text") | .part.text' out/stream.ndjson 2>/dev/null \
              | awk 'NF { line = $0 } END { if (line) print line }')"
            case "$outcome_line" in
              PR_URL:*)
                echo "Implementer finished: $outcome_line (cost: \$$cost, tokens: $tokens)"
                exit 0
                ;;
              NO_PR:*)
                echo "Implementer reported $outcome_line (questions posted and issue labeled by the agent); no PR opened by design."
                exit 0
                ;;
              WALL:*)
                escalate "implementer stopped early with ${outcome_line} (cost: \$$cost)"
                exit 0
                ;;
              *)
                escalate "unparseable outcome (exit 0, final message does not match the contract); transcript artifact preserved for diagnosis"
                exit 0
                ;;
            esac
          fi

          if [ "$rc" = "1" ]; then
            # opencode exits 1 for both config errors (e.g. invalid credentials,
            # deterministic - a retry fails identically) and infrastructure
            # failures (API unreachable). They are not reliably separable by
            # exit code, so never auto-retry; manual retry stays available via
            # the workflow_dispatch retry input.
            escalate "opencode failed (exit 1, cost: \$$cost, $stderr_tail); retry via workflow_dispatch if the stderr indicates a transient failure; see the opencode output artifact"
            exit 0
          fi

          escalate "unexpected opencode exit code $rc (cost: \$$cost, $stderr_tail); see the opencode output artifact"
