name: Dev Loop Review

on:
  pull_request:
    # opened/labeled: the implementer opens a ready PR and adds the dev-loop
    # label right after (a race the label gate alone would drop) - the draft
    # gate skips draft opens, the head-SHA dedupe bounds double dispatch.
    # labeled: dev-loop also starts the loop on an existing ready PR.
    types: [opened, ready_for_review, synchronize, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review (manual backstop / fixer chain)
        required: true
        type: string
      retry:
        description: Internal retry counter (do not edit)
        required: false
        default: '0'
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: dev-loop-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    name: Reviewer
    # Job-level event filter (docs/dev-loop.md): a labeled event for any label
    # other than dev-loop, or an unlabeled event for any label other than
    # needs-human, can never start the reviewer - skip before a runner is
    # allocated. The gate below remains as defense in depth.
    if: >-
      !(github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'dev-loop') &&
      !(github.event_name == 'pull_request' && github.event.action == 'unlabeled' && github.event.label.name != 'needs-human')
    runs-on: ubuntu-latest
    # 15 min above --time-limit (3600 s = 60 min), per docs/dev-loop.md budgets table
    timeout-minutes: 75
    env:
      GH_REPO: ${{ github.repository }}
      MAX_TURNS: '400'
      MAX_TOKENS: '4000000'
      TIME_LIMIT_SEC: '3600'
      TIME_LIMIT_MIN: '60'
      OPENCODE_VERSION: '2.0.26'
      MAX_DENIED_STREAK: '6'
      MAX_ITERATIONS: '8'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DEV_LOOP_TOKEN }}

      - name: Gate and dedupe
        id: gate
        env:
          GH_TOKEN: ${{ secrets.DEV_LOOP_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          UNLABELED_NAME: ${{ github.event.label.name }}
          HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
          REPO_ID: ${{ github.event.repository.id }}
        run: |
          set -eu
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR number in event; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO_ID" != "$REPO_ID" ]; then
            echo "PR #$PR_NUMBER is from a fork (head repo $HEAD_REPO_ID != $REPO_ID); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_ACTION" = "unlabeled" ] && [ "$UNLABELED_NAME" != "needs-human" ]; then
            echo "Unlabeled '$UNLABELED_NAME', not needs-human; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_ACTION" = "labeled" ] && [ "$UNLABELED_NAME" != "dev-loop" ]; then
            echo "Labeled '$UNLABELED_NAME', not dev-loop; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh label create needs-human --color B60205 \
            --description "dev-loop: human decision required" 2>/dev/null || true
          gh label create dev-loop --color 46A1AA \
            --description "Development and reviewing is performed by an agentic AI dev-loop" 2>/dev/null || true
          pr_json="$(gh pr view "$PR_NUMBER" --json number,headRefOid,isDraft,labels)"
          # Three gates, in order (docs/dev-loop.md): dev-loop label -> not draft
          # -> no needs-human. Draft is a human parking brake; the loop never
          # flips it and never touches a draft PR on any event.
          if ! printf '%s' "$pr_json" | jq -e 'any(.labels[]; .name == "dev-loop")' >/dev/null; then
            echo "PR #$PR_NUMBER lacks the dev-loop label; the loop is opt-in. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(printf '%s' "$pr_json" | jq -r '.isDraft')" = "true" ]; then
            echo "PR #$PR_NUMBER is draft; the loop never touches drafts on any event. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s' "$pr_json" | jq -e 'any(.labels[]; .name == "needs-human")' >/dev/null; then
            echo "PR #$PR_NUMBER is labeled needs-human; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head_sha="$(printf '%s' "$pr_json" | jq -r '.headRefOid')"
          if [ "$EVENT_ACTION" = "unlabeled" ]; then
            # Resume path (docs/dev-loop.md event map): removing needs-human
            # re-reviews the PR with a fresh budget - the head-SHA dedupe and
            # the iteration cap are bypassed by design; a CHANGES_NEEDED
            # verdict re-chains the fixer from the new review.
            echo "Resuming after needs-human removal; re-reviewing PR #$PR_NUMBER with a fresh budget."
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
            echo "marker_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # One review per head SHA: skip if a marker review already exists for it.
          existing="$(gh api repos/${GH_REPO}/pulls/$PR_NUMBER/reviews --paginate \
            | jq -r --arg sha "$head_sha" \
              '[.[] | select(.body | startswith("<!-- dev-loop-review -->")) | select(.commit_id == $sha)] | length')"
          if [ "$existing" != "0" ]; then
            echo "A marker review for head SHA $head_sha already exists; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # CI gate (docs/dev-loop.md): review only a CI-green, format-stable
          # head. The reviewer would otherwise burn a full review cycle on a
          # red head whose findings the fixer produces anyway, or race the
          # auto-formatter's push. Poll the head's check runs (bounded, fail
          # open to the pre-gate behavior on timeout):
          #   - green + tip unchanged -> proceed to the review
          #   - red + tip unchanged   -> dispatch the fixer (CI-failure mode,
          #                               empty review id) and skip
          #   - tip moved             -> skip: the push (e.g. chore: auto-format
          #                               from ci.yml) fires synchronize, which
          #                               starts a fresh reviewer on the new head
          # The poll must exclude the dev-loop's own check runs (job names
          # Reviewer/Fixer/Implementer, kept in sync with the `name:` fields of
          # the three dev-loop workflows): the Reviewer's own check run is
          # in_progress while this gate polls and can never complete first -
          # counting it deadlocks the gate until the timeout.
          ci_wait_start=$(date +%s)
          ci_state=""
          while [ $(( $(date +%s) - ci_wait_start )) -lt 1200 ]; do
            tip_now="$(gh pr view "$PR_NUMBER" --json headRefOid | jq -r '.headRefOid')"
            if [ "$tip_now" != "$head_sha" ]; then
              ci_state="moved"
              break
            fi
            ci_json="$(gh api "repos/${GH_REPO}/commits/${head_sha}/check-runs" 2>/dev/null || true)"
            ci_summary="$(printf '%s' "$ci_json" \
              | jq -r '[.check_runs[]? | select(.name != "Reviewer" and .name != "Fixer" and .name != "Implementer")] | {total: length, done: [.[] | select(.status == "completed")] | length, failed: [.[] | select(.status == "completed" and .conclusion == "failure")] | length} | @json' 2>/dev/null || true)"
            ci_total="$(printf '%s' "$ci_summary" | jq -r '.total // 0' 2>/dev/null || echo 0)"
            ci_done="$(printf '%s' "$ci_summary" | jq -r '.done // 0' 2>/dev/null || echo 0)"
            ci_failed="$(printf '%s' "$ci_summary" | jq -r '.failed // 0' 2>/dev/null || echo 0)"
            if [ "$ci_total" -gt 0 ] && [ "$ci_done" -ge "$ci_total" ]; then
              if [ "$ci_failed" -gt 0 ]; then
                ci_state="red"
              else
                ci_state="green"
              fi
              break
            fi
            sleep 30
          done
          if [ "${ci_state:-}" = "moved" ]; then
            echo "Head moved ($head_sha -> $tip_now) while waiting for CI (auto-format or another push); skipping. The new head's synchronize event re-offers the review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${ci_state:-}" = "red" ]; then
            # Re-check the tip right before dispatching: a format push racing
            # the poll would otherwise send the fixer after a stale red state.
            tip_now="$(gh pr view "$PR_NUMBER" --json headRefOid | jq -r '.headRefOid')"
            if [ "$tip_now" != "$head_sha" ]; then
              echo "Head moved ($head_sha -> $tip_now) after red CI; skipping. The new head's synchronize event re-offers the review."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "CI is red on head $head_sha with the tip unchanged; dispatching the fixer (CI-failure mode, no review findings)."
            if gh workflow run dev-loop-fix.yml --ref main -f pr_number="$PR_NUMBER" -f review_id="" -f retry=0; then
              echo "Fixer dispatched for the CI failure; its push will re-enter the loop via synchronize."
            else
              echo "::warning::Failed to dispatch the fixer for the red CI; proceeding with the review instead."
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${ci_state:-}" = "" ]; then
            echo "CI wait timed out or no relevant check runs on head $head_sha (last poll summary: ${ci_summary:-none}); proceeding with the review (fail open)."
          else
            echo "CI is green on head $head_sha with the tip unchanged; proceeding with the review."
          fi
          # Iteration cap: count marker reviews in the current escalation epoch
          # (since the last dev-loop-escalation comment). At MAX_ITERATIONS the
          # loop parks the PR instead of dispatching - agents cannot see or
          # negotiate the cap.
          epoch_cut="$(gh api repos/${GH_REPO}/issues/$PR_NUMBER/comments --paginate \
            | jq -r '[.[] | select(.body | startswith("<!-- dev-loop-escalation -->")) | .created_at] | last // empty')"
          marker_count="$(gh api repos/${GH_REPO}/pulls/$PR_NUMBER/reviews --paginate \
            | jq -r --arg after "${epoch_cut:-1970-01-01T00:00:00Z}" \
              '[.[] | select(.body | startswith("<!-- dev-loop-review -->")) | select(.submitted_at >= $after)] | length')"
          if [ "$marker_count" -ge "$MAX_ITERATIONS" ]; then
            echo "Iteration cap reached ($marker_count >= $MAX_ITERATIONS marker reviews this epoch); escalating."
            gh pr edit "$PR_NUMBER" --add-label needs-human >/dev/null
            cat > /tmp/dev-loop-escalation.md <<EOF
          <!-- dev-loop-escalation -->
          @chrthom dev-loop iteration cap reached: ${MAX_ITERATIONS} review/fix cycles on PR #${PR_NUMBER} without resolution. The loop is parked; please review the PR and its marker reviews, then remove the \`needs-human\` label to resume with a fresh budget.
          EOF
            gh pr comment "$PR_NUMBER" --body-file /tmp/dev-loop-escalation.md >/dev/null
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "marker_count=$marker_count" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      - name: Render role prompt with budget
        if: steps.gate.outputs.skip != 'true'
        run: |
          mkdir -p out
          sed -e "s/\${MAX_TURNS}/${MAX_TURNS}/g" \
              -e "s/\${TIME_LIMIT_MIN}/${TIME_LIMIT_MIN}/g" \
              .github/dev-loop/prompts/reviewer.md > out/reviewer.rendered.md
          echo "--- rendered prompt ---"
          cat out/reviewer.rendered.md

      - name: Install opencode
        if: steps.gate.outputs.skip != 'true'
        run: |
          # The v2 installer (npm package @opencode/cli) installs to
          # ~/.opencode/bin; the v1 installer at https://opencode.ai/install
          # ships 1.x and cannot reach 2.x releases.
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --version "$OPENCODE_VERSION"
          export PATH="$HOME/.opencode/bin:$PATH"
          command -v opencode
          # The invocation below is verified against this exact version; the
          # v1 -> v2 CLI surface moved substantially (auth/provider/config
          # flags, managed-service architecture, event schema).
          opencode --version | grep -F "$OPENCODE_VERSION" || {
            echo "::error::Installed opencode version does not match the expected $OPENCODE_VERSION - verify the invocation against the new CLI surface before rerunning"
            exit 1
          }

      - name: Run opencode reviewer
        id: opencode
        if: steps.gate.outputs.skip != 'true'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          # The reviewer agent only reads GitHub (PR, diff, linked issue, prior
          # reviews); the post-step posts the review. It uses the read-only
          # DEV_LOOP_TOKEN_READONLY secret when defined and falls back to the
          # write PAT until that secret is created (create it to complete the
          # docs' read-only-environment claim).
          GH_TOKEN: ${{ secrets.DEV_LOOP_TOKEN_READONLY || secrets.DEV_LOOP_TOKEN }}
          DEV_LOOP_PR: ${{ steps.gate.outputs.pr_number }}
          DEV_LOOP_HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
          # Job-local config dir: MISTRAL_API_KEY must be the only credential
          # source (stored auth would otherwise silently mask a rotated secret).
          OPENCODE_CONFIG_DIR: ${{ runner.temp }}/opencode-config
          OPENCODE_DISABLE_AUTOUPDATE: 'true'
          # Websearch provider (docs/dev-loop.md): opencode v2 routes websearch and
          # webfetch through a search provider; without a key every call errors (which
          # also flips the run's exit code - see the rc=1 contract fallback). Pinned in
          # the config below because headless --auto cannot answer the provider prompt.
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # The managed service binds a loopback port; never route it via a
          # proxy. Env keys are case-insensitive, so this covers both the
          # NO_PROXY and no_proxy spellings that tools check.
          NO_PROXY: 127.0.0.1,localhost
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          mkdir -p "$OPENCODE_CONFIG_DIR"
          # Pin the websearch provider; skip when no key is configured so the tool
          # is simply unavailable instead of erroring on a missing provider.
          if [ -n "$TAVILY_API_KEY" ]; then
            printf '{"websearch": {"provider": "tavily"}}\n' > "$OPENCODE_CONFIG_DIR/opencode.jsonc"
            echo "opencode.jsonc: websearch provider pinned to tavily"
          else
            echo "TAVILY_API_KEY not set; websearch/webfetch stay disabled"
          fi

          # Watchdog: consume the JSON event stream, tee it to a file, and kill
          # opencode when the run degenerates:
          #  - MAX_DENIED_STREAK consecutive failed/denied tool calls (state
          #    "failed", or "completed" with a non-zero shell exit)
          #  - MAX_TURNS steps (step_start events)
          #  - MAX_TOKENS cumulative cost-weighted tokens: input + output +
          #    cache.write + 0.1 * cache.read (cached tokens are billed at 10%,
          #    so the cap means "N uncached-equivalent tokens")
          run_watchdog() {
            streak=0
            steps=0
            tokens=0
            jq -c '
              select(.type == "tool_use" or .type == "step_start" or .type == "step_finish")
              | if .type == "tool_use" then {
                    k: "tool",
                    status: (.part.state.status // ""),
                    exit: (.part.state.metadata.metadata.exit // 0)
                  }
                elif .type == "step_start" then { k: "step" }
                else {
                    k: "tokens",
                    t: (
                      (.part.tokens.input // 0)
                      + (.part.tokens.output // 0)
                      + (.part.tokens.cache.write // 0)
                      + (0.1 * (.part.tokens.cache.read // 0))
                    )
                  }
                end' 2>/dev/null \
            | while IFS= read -r entry; do
                k="$(printf '%s' "$entry" | jq -r '.k')"
                case "$k" in
                  step)
                    steps=$((steps + 1))
                    if [ "$steps" -ge "$MAX_TURNS" ]; then
                      echo "watchdog: step limit $MAX_TURNS reached - killing opencode"
                      pkill -TERM -f 'opencode run' || true
                      exit 99
                    fi
                    ;;
                  tokens)
                    tt="$(printf '%s' "$entry" | jq -r '.t')"
                    tokens=$(jq -n --argjson a "$tokens" --argjson b "$tt" '$a + $b | floor')
                    if [ "$tokens" -ge "$MAX_TOKENS" ]; then
                      echo "watchdog: token limit $MAX_TOKENS reached - killing opencode"
                      pkill -TERM -f 'opencode run' || true
                      exit 99
                    fi
                    ;;
                  tool)
                    status="$(printf '%s' "$entry" | jq -r '.status')"
                    exit_code="$(printf '%s' "$entry" | jq -r '.exit')"
                    if [ "$status" = "failed" ] || { [ "$status" = "completed" ] && [ "$exit_code" != "0" ] && [ -n "$exit_code" ] && [ "$exit_code" != "null" ]; }; then
                      streak=$((streak + 1))
                      echo "watchdog: failed tool call streak = $streak"
                      if [ "$streak" -ge "$MAX_DENIED_STREAK" ]; then
                        echo "watchdog: $streak consecutive failed tool calls - killing opencode"
                        pkill -TERM -f 'opencode run' || true
                        exit 99
                      fi
                    elif [ "$status" = "completed" ]; then
                      streak=0
                    fi
                    ;;
                esac
              done
          }

          set -o pipefail
          set +e
          timeout --signal=TERM --kill-after=60 "$TIME_LIMIT_SEC" \
            opencode run --standalone --format json --auto --model mistral/zai-glm-5-3 \
              "$(cat out/reviewer.rendered.md)" \
            2> out/opencode.stderr \
            | tee out/stream.ndjson \
            | run_watchdog
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "--- opencode stderr ---"
          cat out/opencode.stderr || true
          if [ "$rc" = "99" ]; then
            echo "stopped_by_watchdog=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload opencode output artifact
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: opencode-reviewer-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/stream.ndjson
            out/opencode.stderr
            out/reviewer.rendered.md
          if-no-files-found: warn

      - name: Post-step state machine
        if: always() && steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.DEV_LOOP_TOKEN }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          REVIEWED_SHA: ${{ steps.gate.outputs.head_sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RETRY_COUNT: ${{ inputs.retry || '0' }}
          REPOSITORY: ${{ github.repository }}
          # The token user is the repo owner (the PAT's login) - the same
          # identity the fixer gate trusts as REPO_OWNER.
          REPO_OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          escalate() {
            gh pr edit "$PR_NUMBER" --add-label needs-human >/dev/null
            cat > /tmp/dev-loop-escalation.md <<EOF
          <!-- dev-loop-escalation -->
          @chrthom dev-loop reviewer escalation: $1

          PR: #${PR_NUMBER}
          Run: ${RUN_URL}
          EOF
            gh pr comment "$PR_NUMBER" --body-file /tmp/dev-loop-escalation.md >/dev/null
          }

          rc="${{ steps.opencode.outputs.rc }}"

          if [ -z "$rc" ]; then
            # opencode never ran: a pre-run step (npm ci, install, version check, render) failed.
            if [ "$RUN_ATTEMPT" = "1" ]; then
              echo "A step failed before the agent ran; leaving a red run for re-run failed jobs."
              exit 1
            fi
            escalate "a workflow step failed before the agent ran (twice); retry via workflow_dispatch (Actions -> Dev Loop Review -> Run workflow) or remove the needs-human label"
            exit 0
          fi

          # Cost = sum of the per-step cost fields in the event stream
          # (opencode reports cost/tokens on every step_finish event). tokens
          # uses the same cost-weighted sum as the watchdog cap, so the
          # reported number matches what the cap enforced.
          # Round to cents: every consumer prints $cost verbatim, and the raw
          # sum has float artifacts (e.g. $0.16212848000000002).
          cost="$(jq -s '[.[].part.cost // 0] | add // 0 | (.*100 | round) / 100' out/stream.ndjson 2>/dev/null || echo 0)"
          stderr_tail="$(tail -1 out/opencode.stderr 2>/dev/null || true)"

          if [ "$rc" = "99" ]; then
            # The watchdog killed opencode (failure streak / step / token cap):
            # the run misbehaved or blew the budget. Never retry, escalate.
            escalate "reviewer killed by the watchdog (rc=99; failure streak / step cap ${MAX_TURNS} / token cap ${MAX_TOKENS}; cost: \$$cost) - see the opencode output artifact"
            exit 0
          fi

          if [ "$rc" = "124" ]; then
            # deadline hit (timeout(1)): never auto-retry, escalate.
            escalate "reviewer stopped on the ${TIME_LIMIT_MIN} min deadline (rc=124, cost: \$$cost); see the opencode output artifact"
            exit 0
          fi

          if [ "$rc" = "1" ]; then
            # opencode exits 1 for config/infra failures AND for sessions that
            # recorded (recovered) tool errors - v2.0.26 observed on the #98/#99
            # loop: a failed websearch/webfetch (no provider key configured)
            # marks the session errored even when the agent completed its work
            # with a valid VERDICT line. The verdict is the ground truth: fall
            # through to normal handling when the contract line parses, and
            # escalate only when it does not.
            contract_line="$(jq -r 'select(.type == "text") | .part.text' out/stream.ndjson 2>/dev/null \
              | grep -E '^(VERDICT: (CLEAN|CHANGES_NEEDED|NEEDS_HUMAN)|WALL:)' | tail -1 || true)"
            if [ -z "$contract_line" ]; then
              escalate "opencode failed (exit 1, no VERDICT line; cost: \$$cost, $stderr_tail); retry via workflow_dispatch if the stderr indicates a transient failure; see the opencode output artifact"
              exit 0
            fi
            echo "opencode exited 1 but the final message carries $contract_line; treating the session as completed (tool errors were recovered)."
            rc=0
          fi

          if [ "$rc" != "0" ]; then
            escalate "unexpected opencode exit code $rc (cost: \$$cost, $stderr_tail); see the opencode output artifact"
            exit 0
          fi

          # exit 0: the verdict lives in the final assistant message; the agent
          # never posts the review itself - this step does, with the PAT.
          # Assistant text = the stream's text events (all of them; the verdict
          # contract lives in the final message, so the last VERDICT line wins).
          final_msg="$(jq -r 'select(.type == "text") | .part.text' out/stream.ndjson 2>/dev/null || true)"
          outcome_line="$(printf '%s\n' "$final_msg" | awk 'NF { line = $0 } END { if (line) print line }')"

          case "$outcome_line" in
            WALL:*)
              escalate "reviewer stopped early with ${outcome_line} (cost: \$$cost)"
              exit 0
              ;;
          esac

          verdict_num="$(printf '%s\n' "$final_msg" | grep -nE '^VERDICT: (CLEAN|CHANGES_NEEDED|NEEDS_HUMAN)$' | tail -1 | cut -d: -f1 || true)"
          verdict_line="$(printf '%s\n' "$final_msg" | sed -n "${verdict_num:-0}p" || true)"
          case "${verdict_line:-}" in
            VERDICT:\ CLEAN|VERDICT:\ CHANGES_NEEDED|VERDICT:\ NEEDS_HUMAN) ;;
            *)
              # A clean exit (rc=0) with no VERDICT line is usually a truncated
              # run (agent stopped mid-investigation, opencode gave up silently)
              # - transient, unlike a deterministic parse failure. Retry once
              # via workflow_dispatch; the retry counter in the input prevents
              # a loop. The retry run re-reviews the same head; no marker review
              # was posted, so the reviewer gate's dedupe cannot block it.
              if [ "$RETRY_COUNT" -lt 1 ] \
                && gh workflow run dev-loop-review.yml --ref main -f pr_number="$PR_NUMBER" -f retry=1; then
                echo "Unparseable outcome with no VERDICT line (cost: \$$cost); re-dispatching the reviewer once (retry=1). Transcript artifact preserved for diagnosis."
                exit 0
              fi
              escalate "unparseable outcome (exit 0, final message does not match the VERDICT contract; retry exhausted); transcript artifact preserved for diagnosis"
              exit 0
              ;;
          esac
          verdict="${verdict_line#VERDICT: }"
          echo "Reviewer verdict: $verdict (cost: \$$cost)"

          current_sha="$(gh pr view "$PR_NUMBER" --json headRefOid | jq -r '.headRefOid')"
          if [ "$current_sha" != "$REVIEWED_SHA" ]; then
            echo "Head SHA moved ($REVIEWED_SHA -> $current_sha) since the review started; not acting on the stale verdict, re-dispatching the reviewer."
            if ! gh workflow run dev-loop-review.yml --ref main -f pr_number="$PR_NUMBER"; then
              escalate "failed to re-dispatch the reviewer after a stale head SHA ($REVIEWED_SHA -> $current_sha); retry via workflow_dispatch (Actions -> Dev Loop Review -> Run workflow)"
            fi
            exit 0
          fi

          # Compose and post the marker review. The findings JSON object is
          # the text after the VERDICT line in the final assistant message
          # (fenced or bare); anything missing or unparseable degrades to [].
          # KEEP IN SYNC with dev-loop-fix.yml: its gates match this exact body
          # shape - the marker alone on line 1 and a bare `Verdict: <V>` line -
          # and the reviewer's own head-SHA dedupe greps the marker line too.
          findings_json="$(printf '%s\n' "$final_msg" \
            | tail -n +"$(( ${verdict_num:-1} + 1 ))" \
            | sed -n '/^{/,$p' \
            | sed '/^```/d' \
            | jq 'try (select(type == "object") | .findings) catch null' 2>/dev/null)"
          [ -n "$findings_json" ] || findings_json='[]'
          # Verdict and findings must fail together: the verdict rules say a
          # non-CLEAN verdict always has at least one finding, so a non-CLEAN
          # verdict with zero parsed findings is a parse failure, not a clean
          # result - escalate instead of posting an empty findings review the
          # fixer cannot act on.
          if [ "$verdict" != "CLEAN" ] \
            && [ "$(printf '%s' "$findings_json" | jq 'length' 2>/dev/null || echo 0)" = "0" ]; then
            escalate "unparseable outcome (exit 0, verdict $verdict but the findings JSON is missing or has zero findings); transcript artifact preserved for diagnosis"
            exit 0
          fi
          # Hybrid posting: findings anchored to a diff line become inline
          # comments; the rest (and every finding if inline posting fails)
          # go into the review body as a markdown list.
          body_findings="$(printf '%s' "$findings_json" \
            | jq -r '.[] | select((.path // empty | length) == 0 or (.line // 0) == 0) \
              | "- **[" + (.severity // "minor") + "]**" + (if .needs_human then " **[needs human]**" else "" end) + " " + (.message // .body // (. | tostring))' 2>/dev/null || true)"
          body="<!-- dev-loop-review -->
          Verdict: $verdict

          dev-loop review of $REVIEWED_SHA (cost: \$$cost)."
          if [ -n "$body_findings" ]; then
            body="$body

          $body_findings"
          fi
          # One pending review per user per PR: a stale pending review of the
          # TOKEN USER from a previously failed post blocks every new POST with
          # 422 (observed on PR #106). Delete it before posting - but ONLY the
          # token user's own (the repo owner; the list-reviews endpoint returns
          # every user's pending review and reviews are world-postable on this
          # public repo, so a third party's draft must not be touched), and
          # ONLY one provably not the owner's draft findings: zero draft
          # comments AND an empty body, or a first-line
          # <!-- dev-loop-review --> marker - an HTML comment that renders
          # invisibly in the GitHub UI; the human findings channel is
          # non-marker by definition, so a marker-prefixed pending review
          # is a loop leftover (e.g. a misbehaving actor POSTing a
          # body-carrying review) that must self-heal too, or it 422-blocks
          # every future POST. Anything else may be the owner's findings
          # review being drafted in the GitHub UI (or autosaved via the API
          # with its body already set) - the body is the primary human
          # findings payload - and is left alone (it 422-blocks the POST; the
          # warning below makes that visible instead).
          pending_review_id="$(gh api "repos/${REPOSITORY}/pulls/$PR_NUMBER/reviews" --paginate \
            | jq -r --arg owner "$REPO_OWNER" '[.[] | select(.state == "PENDING") | select(.user.login == $owner)] | first | .id // empty')"
          if [ -n "$pending_review_id" ]; then
            # Fail closed: an unknown comment count or body means "maybe a
            # draft" - the POST can still 422, which escalates visibly, but a
            # human draft is never destroyed on a query failure. The marker
            # check stays outside fail-closed: a marker-prefixed body proves
            # loop origin even when the comment count is unknown.
            pending_comments="$(gh api "repos/${REPOSITORY}/pulls/$PR_NUMBER/reviews/$pending_review_id/comments" \
              --jq 'length' 2>/dev/null || echo unknown)"
            pending_body="$(gh api "repos/${REPOSITORY}/pulls/$PR_NUMBER/reviews/$pending_review_id" \
              --jq '.body // ""' 2>/dev/null || echo unknown)"
            if { [ "$pending_comments" = "0" ] && [ -z "$(printf '%s' "$pending_body" | tr -d '[:space:]')" ]; } \
              || printf '%s' "$pending_body" | head -1 | grep -q '^<!-- dev-loop-review -->$'; then
              echo "Deleting stale pending review $pending_review_id before posting (comment- and body-less, or marker-prefixed i.e. provably a loop leftover, not a human draft; it would 422-block the POST)."
              gh api -X DELETE "repos/${REPOSITORY}/pulls/$PR_NUMBER/reviews/$pending_review_id" >/dev/null \
                || echo "::warning::Could not delete pending review $pending_review_id; the POST may 422."
            else
              echo "::warning::Pending review $pending_review_id carries ${pending_comments} draft comment(s) or a non-marker draft body (likely the owner's review draft in the GitHub UI); NOT deleting it. If it is a loop leftover, delete it manually - it 422-blocks the review POST."
            fi
          fi
          cat > /tmp/dev-loop-review.json <<EOF
          {
            "commit_id": "$REVIEWED_SHA",
            "event": "COMMENT",
            "body": $(printf '%s' "$body" | jq -Rs .),
            "comments": $(printf '%s' "$findings_json" | jq '[.[] | select((.path // empty | length) > 0 and (.line // 0) > 0) | {path: .path, line: .line, side: "RIGHT", body: ("**[" + (.severity // "minor") + "]**" + (if .needs_human then " **[needs human]**" else "" end) + " " + (.message // .body // (. | tostring)))}]' 2>/dev/null || echo '[]')
          }
          EOF
          if ! jq -e . /tmp/dev-loop-review.json >/dev/null 2>&1; then
            escalate "the review payload is not valid JSON (body/comments build failed); verdict was $verdict - see the run log"
            exit 0
          fi
          review_post_id="$(gh api "repos/${REPOSITORY}/pulls/$PR_NUMBER/reviews" -X POST --input /tmp/dev-loop-review.json --jq .id 2>&1 || true)"
          case "$review_post_id" in
            ''|*[!0-9]*)
              # gh emits the error object (not an id) on failure - never pass
              # it on; log it in full for diagnosis.
              echo "::warning::Inline review POST failed: $review_post_id"
              review_post_id=""
              ;;
          esac
          if [ -z "$review_post_id" ]; then
            # GitHub rejects inline comments outside the diff: retry once with
            # every finding in the body (PR #80 behavior) before escalating.
            all_findings="$(printf '%s' "$findings_json" \
              | jq -r '.[] | "- **[" + (.severity // "minor") + "]**" + (if .needs_human then " **[needs human]**" else "" end) + " " + ((.path // "?") + ":" + ((.line // 0) | tostring) + " ") + (.message // .body // (. | tostring))' 2>/dev/null || true)"
            fallback_body="<!-- dev-loop-review -->
          Verdict: $verdict

          dev-loop review of $REVIEWED_SHA (cost: \$$cost).

          $all_findings"
            # -n (null input): without it jq emits the object once per input
            # document, and a step with no stdin produces zero documents - an
            # empty payload file that then fails the validation below (the
            # PR #113 escalation; the fallback had never run before #108
            # surfaced it).
            jq -n --arg body "$fallback_body" --arg sha "$REVIEWED_SHA" \
              '{commit_id: $sha, event: "COMMENT", body: $body, comments: []}' \
              > /tmp/dev-loop-review.json
            if ! jq -e . /tmp/dev-loop-review.json >/dev/null 2>&1; then
              escalate "the fallback review payload is not valid JSON; verdict was $verdict - see the run log"
              exit 0
            fi
            review_post_id="$(gh api "repos/${REPOSITORY}/pulls/$PR_NUMBER/reviews" -X POST --input /tmp/dev-loop-review.json --jq .id 2>&1 || true)"
            case "$review_post_id" in
              ''|*[!0-9]*)
                escalate "the review post failed (inline and fallback both rejected: $review_post_id); verdict was $verdict - see the run log"
                exit 0
                ;;
            esac
          fi

          case "$verdict" in
            CLEAN)
              echo "Verdict CLEAN: the PR stands ready for a human merge decision; no state change."
              exit 0
              ;;
            CHANGES_NEEDED)
              case "$review_post_id" in
                ''|*[!0-9]*)
                  # Unreachable with the hardened post above, but a non-numeric
                  # id must never reach the fixer (PR #106: the 422 error JSON
                  # was dispatched as a review id and crashed the fixer gate).
                  escalate "internal error: review_post_id is not numeric ('$review_post_id'); the review stands - retry the fixer via workflow_dispatch"
                  exit 0
                  ;;
              esac
              echo "Verdict CHANGES_NEEDED: dispatching the fixer with the exact review id ($review_post_id)."
              # Pass the posted review's id, not "latest": a second
              # CHANGES_NEEDED review landing before the fixer's gate must
              # not make the fixer act on the wrong review.
              if ! gh workflow run dev-loop-fix.yml --ref main \
                -f pr_number="$PR_NUMBER" -f review_id="$review_post_id"; then
                escalate "failed to dispatch the fixer for this CHANGES_NEEDED review; the review stands - retry via workflow_dispatch (Actions -> Dev Loop Fix -> Run workflow)"
              fi
              exit 0
              ;;
            NEEDS_HUMAN)
              escalate "review verdict NEEDS_HUMAN - at least one finding requires a human decision; see the review just posted"
              exit 0
              ;;
          esac
